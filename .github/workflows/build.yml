name: Build

permissions:
  contents: write
  discussions: write

on:
  push:
    branches: "*"
    paths:
      - "**/*.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - ".github/workflows/build.yml"
    tags: "*"
  pull_request:
    branches: "*"
    paths:
      - "**/*.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - ".github/workflows/build.yml"

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          # Ubuntu 22.04 (glibc 2.35) instead of ubuntu-latest (24.04, glibc 2.39) so the
          # AppImage runs on older distributions. gpui needs webkit2gtk-4.1, which is not
          # available on Ubuntu 20.04, so 22.04 is the oldest feasible build base.
          - ubuntu-22.04
          - ubuntu-24.04-arm
          - macos-15-intel # Intel
          - macos-latest # Apple Silicon
          - windows-latest

    env:
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: full
      CARGO_TERM_COLOR: always

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              gcc g++ clang libfontconfig-dev libwayland-dev \
              libwebkit2gtk-4.1-dev libxkbcommon-x11-dev \
              libx11-xcb-dev libxcb1-dev \
              libssl-dev libzstd-dev \
              vulkan-validationlayers libvulkan1 mesa-vulkan-drivers \
              mold squashfs-tools

      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt, clippy

      - name: Log versions
        run: |
          rustc --version
          cargo --version

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |-
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo check
        run: cargo check --locked

      - name: Run cargo clippy
        run: cargo clippy -- -D warnings

      - name: Run cargo test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      # target/ is restored from a cache shared by every runner of the same OS (and
      # across Linux arch runners), so it can contain packaged artifacts from older
      # releases/other archs. Remove them before packaging so only this run's freshly
      # built artifacts exist and get uploaded.
      - name: Clean stale packaged artifacts
        shell: bash
        run: |
          rm -f target/release/gpui-memory-game_*.AppImage \
                target/release/gpui-memory-game_*.dmg \
                target/release/gpui-memory-game_*.msi \
                target/release/gpui-memory-game_*-setup.exe \
                target/release/gpui-memory-game_*.deb \
                target/release/gpui-memory-game_*.tar.gz

      - name: Package release
        run: |-
          cargo install cargo-packager
          cargo packager --release

      # cargo-packager's AppImage can embed AppRun and the main binary with owner-only
      # exec bits (e.g. 0744), so non-root users get "Permission denied" at startup,
      # which fails the AppImage.appimage.github.io catalog test. Additionally, gpui on
      # Linux requires a Vulkan device, so we bundle the lavapipe software driver as a
      # fallback for environments without any Vulkan driver (e.g. headless CI).
      # Fix both by extracting the AppImage, patching it and re-packaging it.
      - name: Patch and repack AppImage
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          set -euxo pipefail
          if [ "${{ runner.arch }}" = "ARM64" ]; then
            triplet="aarch64-linux-gnu"
            tool_url="https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-aarch64.AppImage"
          else
            triplet="x86_64-linux-gnu"
            tool_url="https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          fi
          # target/ is cached across OS only (not per-arch), so stale AppImages from
          # other architectures/versions may linger here; pick the newest one.
          appimage="$(ls -1t target/release/gpui-memory-game_*.AppImage 2>/dev/null | head -n1)"
          [ -n "$appimage" ]
          cp "$appimage" /tmp/gpui-memory-game.AppImage
          rm -rf /tmp/squashfs-root
          (cd /tmp && ./gpui-memory-game.AppImage --appimage-extract && rm gpui-memory-game.AppImage)

          root=/tmp/squashfs-root
          # 1. every file must be world-readable/executable (fixes owner-only exec bits)
          chmod -R a+rX "$root"

          # 2. bundle the lavapipe software Vulkan driver + loader + LLVM and the
          #    matching ICD, so headless/CI hosts without any Vulkan ICD can
          #    still run the app through the software renderer
          mkdir -p "$root/usr/lib/$triplet" "$root/usr/share/vulkan/icd.d"
          cp -a /usr/lib/$triplet/libvulkan_lvp.so* "$root/usr/lib/$triplet/"
          # the Vulkan loader is needed to enumerate drivers; without it,
          # dlopen("libvulkan.so.1") fails even when an ICD is present
          cp -a /usr/lib/$triplet/libvulkan.so.1* "$root/usr/lib/$triplet/" || true
          # lavapipe (llvmpipe) needs LLVM at runtime; bundle it so the fallback
          # also works on hosts without any Mesa installation
          cp -a /usr/lib/$triplet/libLLVM*.so.1* "$root/usr/lib/$triplet/" || true
          # pick the ICD file by name (varies between distros/arches)
          lvp_json="$(ls /usr/share/vulkan/icd.d/*lvp*.json 2>/dev/null | head -n1)"
          [ -n "$lvp_json" ] || { echo "ERROR: no lavapipe ICD json found" >&2; exit 1; }
          icd="$(basename "$lvp_json")"
          cp "$lvp_json" "$root/usr/share/vulkan/icd.d/"
          # the packaged ICD references the driver via a path relative to the
          # json's directory; repoint it at the bundled copy
          python3 - "$root/usr/share/vulkan/icd.d/$icd" "$triplet" <<'PYEO'
          import json, sys
          p, t = sys.argv[1], sys.argv[2]
          d = json.load(open(p))
          d["ICD"]["library_path"] = "../../../../usr/lib/%s/libvulkan_lvp.so" % t
          json.dump(d, open(p, "w"), indent=2)
          PYEO

          # 3. wrap the original AppRun so the bundled driver is used only when the
          #    system has no Vulkan drivers at all
          mv "$root/AppRun" "$root/usr/bin/AppRun.orig"
          cat > "$root/AppRun" <<'WRAP'
          #!/bin/bash
          here="$(cd "$(dirname "$(readlink -f "$0")")" && pwd)"
          # Use the bundled lavapipe software Vulkan driver only when no system Vulkan
          # drivers exist (headless/CI/VMs); keep real drivers in front otherwise.
          if ! compgen -G "/usr/share/vulkan/icd.d/*.json" >/dev/null 2>&1 && \
             ! compgen -G "/etc/vulkan/icd.d/*.json" >/dev/null 2>&1; then
            export VK_ICD_FILENAMES="$here/usr/share/vulkan/icd.d/{{ICD}}"
            export VK_DRIVER_FILES="$here/usr/share/vulkan/icd.d/{{ICD}}"
            export LD_LIBRARY_PATH="$here/usr/lib/{{TRIPLET}}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          exec "$here/usr/bin/AppRun.orig" "$@"
          WRAP
          sed -i -e "s/{{ICD}}/$icd/" -e "s/{{TRIPLET}}/$triplet/" "$root/AppRun"
          chmod 0755 "$root/AppRun"

          # 4. re-package with appimagetool (run without FUSE) and overwrite the AppImage
          curl -fsSL "$tool_url" -o /tmp/appimagetool.AppImage
          chmod +x /tmp/appimagetool.AppImage
          /tmp/appimagetool.AppImage --appimage-extract-and-run "$root" "$PWD/${appimage}"

          # 5. verify the re-packaged AppImage
          rm -rf "$root"
          cp "$appimage" /tmp/gpui-memory-game-check.AppImage
          (cd /tmp && ./gpui-memory-game-check.AppImage --appimage-extract >/dev/null)
          mode="$(stat -c '%a' /tmp/squashfs-root/AppRun)"
          grep -q 'AppRun.orig' /tmp/squashfs-root/AppRun || { echo "ERROR: AppRun wrapper missing" >&2; exit 1; }
          test -f /tmp/squashfs-root/usr/share/vulkan/icd.d/$icd || { echo "ERROR: lavapipe ICD missing" >&2; exit 1; }
          test -f /tmp/squashfs-root/usr/lib/$triplet/libvulkan_lvp.so || { echo "ERROR: lavapipe driver missing" >&2; exit 1; }
          rm -f /tmp/gpui-memory-game-check.AppImage
          rm -rf /tmp/squashfs-root
          [ "$mode" = "755" ] || { echo "ERROR: AppRun mode is $mode, expected 755" >&2; exit 1; }
          echo "AppRun permissions OK ($mode), lavapipe fallback bundled"

      - name: Pre-release (linux x86_64)
        if: matrix.os == 'ubuntu-22.04'
        run: zip -r gpui-memory-game-x86_64-unknown-linux-gnu.zip gpui-memory-game
        working-directory: target/release

      - name: Pre-release (linux aarch64)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: zip -r gpui-memory-game-aarch64-unknown-linux-gnu.zip gpui-memory-game
        working-directory: target/release

      - name: Pre-release (mac)
        if: matrix.os == 'macos-15-intel'
        run: zip -r gpui-memory-game-x86_64-apple-darwin.zip gpui-memory-game.app
        working-directory: target/release

      - name: Pre-release (aarch64-apple-darwin)
        if: matrix.os == 'macos-latest'
        run: zip -r gpui-memory-game-aarch64-apple-darwin.zip gpui-memory-game.app
        working-directory: target/release

      - name: Pre-release (windows x86_64)
        if: matrix.os == 'windows-latest'
        run: |
          Compress-Archive -CompressionLevel Optimal -Force -Path target/release/gpui-memory-game.exe -DestinationPath target/release/gpui-memory-game-x86_64-pc-windows-msvc.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        if: |
          startsWith(github.repository, 'justjavac') &&
          startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            target/release/gpui-memory-game-x86_64-pc-windows-msvc.zip
            target/release/gpui-memory-game-x86_64-unknown-linux-gnu.zip
            target/release/gpui-memory-game-x86_64-apple-darwin.zip
            target/release/gpui-memory-game-aarch64-apple-darwin.zip
            target/release/gpui-memory-game-aarch64-unknown-linux-gnu.zip
            target/release/gpui-memory-game_*.dmg
            target/release/gpui-memory-game_*.msi
            target/release/gpui-memory-game_*-setup.exe
            target/release/gpui-memory-game_*.deb
            target/release/gpui-memory-game_*.AppImage
            target/release/gpui-memory-game_*.tar.gz
